    background: #e9ecef;

  table {
    width: 100%;

  thead th {

    padding: 10px;
    position: sticky;
    top: 0;
    border-bottom: 1px solid #d8d8d8;
    text-align: left;
  }

  tbody td {
    padding: 9px;
    border-bottom: 1px solid #d8d8d8;
    text-align: left;
    vertical-align: middle;
  }

  tbody tr.drawn td {
    background: #fff300;
  }
</style>

<body>
  <h1>Beer inventory</h1>
  <p class="status" id="status">Ready: use buttons to sort or draw 5 random beers.</p>

  <div class="controls">
    <button id="drawBtn">Draw 5 random beers</button>

    <button class="sortbtn" data-sort="brewery-asc">Sort: Brewery A → Z</button>
    <button class="sortbtn" data-sort="brewery-desc">Sort: Brewery Z → A</button>

    <button class="sortbtn" data-sort="name-asc">Sort: Beer A → Z</button>
    <button class="sortbtn" data-sort="name-desc">Sort: Beer Z → A</button>

    <button class="sortbtn" data-sort="abv-asc">Sort: ABV ↑</button>
    <button class="sortbtn" data-sort="abv-desc">Sort: ABV ↓</button>

    <button class="sortbtn" data-sort="expiration-asc">Sort: Expiration earliest → latest</button>
    <button class="sortbtn" data-sort="expiration-desc">Sort: Expiration latest → earliest</button>
  </div>

  <table id="beerTable">
    <thead>
      <tr>
        <th>Brewery</th>
        <th>Beer</th>
        <th>ABV</th>
        <th>Expiration</th>
        <th>Bottle</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

const tbody = document.getElementById('tbody');
const status = document.getElementById('status');

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function parseCsv(csvText) {
  const clean = csvText.replace(/^\uFEFF/, '').trim();
  const lines = clean.split(/\r?\n/);
  const rows = [];

  // Skip header line.
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;

    const parts = line.split(',');

    const brewery = parts.length > 0 ? parts[0].trim() : '';
    const name = parts.length > 1 ? parts[1].trim() : '';
    const abvText = parts.length > 2 ? parts[2].trim() : '';
    const expires = parts.length > 3 ? parts[3].trim() : '';
    const bottle = parts.length > 4 ? parts[4].trim() : '';

    rows.push({
      id: rows.length + 1,
      brewery,
      name,
      abv: abvText ? Number(abvText) : null,
      expires,
      bottle
    });
  }

  return rows;
}

function expirySortValue(value) {
  if (!value) return null;

  const parts = value.split('-');
  if (parts.length !== 2) return null;

  const month = parseInt(parts[0], 10);
  let year = parseInt(parts[1], 10);

  if (year >= 0 && year <= 99) year += 2000;

  return year * 100 + month;
}

const allRows = parseCsv(rawCsv);
let currentRows = allRows.slice();
let drawIds = new Set();

function cmpStr(a, b) {
  return String(a).localeCompare(String(b), 'nl', { ignoreCase: true, sensitivity: 'base' });
}

function render(rows) {
  currentRows = rows;

  const html = rows.map(row => {
    const cls = drawIds.has(row.id) ? ' class="drawn"' : '';

    const exp = row.expires ? escapeHtml(row.expires) : '<span class="emptyDate">—</span>';
    const bottle = row.bottle ? escapeHtml(row.bottle) : '';
    const abv = row.abv === null ? '' : escapeHtml(row.abv);

    return `<tr${cls}>
      <td>${escapeHtml(row.brewery)}</td>
      <td>${escapeHtml(row.name)}</td>
      <td>${abv}</td>
      <td>${exp}</td>
      <td>${bottle}</td>
    </tr>`;
  });

  tbody.innerHTML = html.join('\n');
}

function sortRows(field, dir) {
  const asc = dir === 'asc';

  const sorted = currentRows.slice().sort((a, b) => {
    if (field === 'brewery') {
      const c = cmpStr(a.brewery, b.brewery);
      if (c !== 0) return asc ? c : -c;

      const c2 = cmpStr(a.name, b.name);
      if (c2 !== 0) return asc ? c2 : -c2;

      return asc ? a.id - b.id : b.id - a.id;
    }

    if (field === 'name') {
      const c = cmpStr(a.name, b.name);
      if (c !== 0) return asc ? c : -c;

      const c2 = cmpStr(a.brewery, b.brewery);
      if (c2 !== 0) return asc ? c2 : -c2;

      return asc ? a.id - b.id : b.id - a.id;
    }

    if (field === 'abv') {
      if (a.abv === null || b.abv === null) {
        if (a.abv === b.abv) return 0;
        return a.abv === null ? 1 : -1; // nulls/missing always at end
      }

      if (a.abv !== b.abv) {
        return asc ? a.abv - b.abv : b.abv - a.abv;
      }

      const c = cmpStr(a.brewery, b.brewery);
      if (c !== 0) return asc ? c : -c;

      return asc ? a.id - b.id : b.id - a.id;
    }

    if (field === 'expiration') {
      const av = expirySortValue(a.expires);
      const bv = expirySortValue(b.expires);

      if (av === null || bv === null) {
        if (av === null && bv === null) return 0;
        return av === null ? 1 : -1; // missing dates always at end
      }

      if (av !== bv) {
        return asc ? av - bv : bv - av;
      }

      const c = cmpStr(a.brewery, b.brewery);
      if (c !== 0) return asc ? c : -c;

      const c2 = cmpStr(a.name, b.name);
      if (c2 !== 0) return asc ? c2 : -c2;

      return asc ? a.id - b.id : b.id - a.id;
    }

    return 0;
  });

  currentRows = sorted;
  render(currentRows);
}

function drawRandom() {
  const ids = currentRows.map(row => row.id);
  const count = Math.min(5, ids.length);

  if (count === 0) {
    drawIds.clear();
    status.textContent = 'No beers available to draw.';
    return;
  }

  // Fisher-Yates shuffle to pick unique random rows.
  for (let i = ids.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = ids[i];
    ids[i] = ids[j];
    ids[j] = tmp;
  }

  drawIds = new Set(ids.slice(0, count));
  render(currentRows);
  status.textContent = `${count} beer${count === 1 ? '' : 's'} highlighted. Press again for a new draw.`;
}

document.querySelectorAll('button[data-sort]').forEach(btn => {
  btn.addEventListener('click', () => {
    const [field, dir] = btn.dataset.sort.split('-');
    sortRows(field, dir);
    status.textContent = 'Sorted.';
  });
});

document.getElementById('drawBtn').addEventListener('click', drawRandom);

render(currentRows);
</script>
